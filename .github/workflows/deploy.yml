name: Deploy Laravel to cPanel

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/cpanel_key
          chmod 600 ~/.ssh/cpanel_key

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/cpanel_key \
            -p "${{ secrets.CPANEL_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "echo connected && whoami && pwd"

      - name: Deploy on cPanel
        run: |
          ssh -i ~/.ssh/cpanel_key \
            -p "${{ secrets.CPANEL_PORT }}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${{ secrets.CPANEL_USER }}@${{ secrets.CPANEL_HOST }}" \
            "bash ~/deploy_almuharib.sh"
